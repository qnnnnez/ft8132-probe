[package]
edition      = "2024"
name         = "ft8132-probe"
rust-version = "1.99"
version      = "0.1.0"
autobins     = false

[[bin]]
name = "ft8132-probe"
path = "src/bin/usbdisk2.rs"

[dependencies]
embassy-stm32 = { version = "0.6.0", features = [
  "stm32f103c6",
  "time",
  "time-driver-tim2",
  "unstable-pac",
] }
embassy-executor = { version = "0.10.0", features = [
  "platform-cortex-m",
  "executor-thread",
] }
embassy-time = { version = "0.5.1", features = ["tick-hz-32_768"] }
embassy-sync = "0.8.0"

cortex-m = { version = "0.7.9", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.7"
panic-halt = "1.0.0"
static_cell = "2.1.1"

usb-device = "0.3.2"
stm32-usbd = { path = "vendor/stm32-usbd" }
usbd-storage = { path = "vendor/usbd-storage/usbd-storage", features = ["bbb", "scsi"] }

[features]
default = []
# In-firmware capture-seeded ASIC; no PB7/PB6 / I2C1 wiring required.
mock-asic = []

[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"

[profile.release]
codegen-units    = 1     # LLVM can perform better optimizations using a single thread
debug            = 2
debug-assertions = false
incremental      = false
lto              = "fat"
opt-level        = "s"
overflow-checks  = false
