[project]
name = "ft8132-bench"
version = "0.1.0"
description = "Workbench CLI: PSU, flash, and FT8132 SCSI probe on n3150."
requires-python = ">=3.11"
dependencies = [
    "ft8132",
    "pyserial>=3.5",
    "typer>=0.12",
]

[project.scripts]
bench = "ft8132_bench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ft8132_bench"]

[tool.uv.sources]
ft8132 = { path = "../host/ft8132" }

[tool.ruff]
target-version = "py311"
line-length = 100
